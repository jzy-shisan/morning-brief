name: 每日晨报

on:
  # GitHub 的 cron 用的是 UTC：22:00 UTC = 北京时间次日 06:00
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      DAFEIYU_API_KEY: ${{ secrets.DAFEIYU_API_KEY }}
      DAFEIYU_BASE_URL: https://api.deepseek.com/v1
      DAFEIYU_MODEL: deepseek-chat
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取并生成（新闻）
        run: python morning_brief.py --force

      - name: 抓取并生成（学生）
        run: python student_brief.py --force

      - name: 把当天内容提交回仓库（存档 + 去重账本）
        run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "晨报 $(date +%F)"
            git push
          fi

      - name: 组装站点目录
        run: |
          mkdir -p _site/share _site/history
          cp -r docs/. _site/
          cp share/*.html _site/share/
          cp history/*.html _site/history/ 2>/dev/null || true
          touch _site/.nojekyll

      - name: 上传站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
